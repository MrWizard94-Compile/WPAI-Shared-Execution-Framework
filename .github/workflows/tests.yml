name: Windows tests

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python }}
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10.11', '3.14.3']
    defaults:
      run:
        working-directory: work/wpai-exec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Discover and run all tests
        run: python -B -W error -m unittest discover -s tests -v
      - name: Verify the archived synthetic MCP fixture
        working-directory: .
        run: python -B -W error work/benchmarks/stage-1.2/verify_fixture.py
      - name: Verify offline lifecycle, comparator and repeatability plan
        working-directory: .
        run: |
          python -B -W error -m unittest discover -s work/benchmarks/stage-1.3/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -W error work/benchmarks/stage-1.3/public_evidence.py
      - name: Verify Stage 1.3.1 offline corrective tests and evidence
        working-directory: .
        run: |
          python -B -W error -m unittest discover -s work/benchmarks/stage-1.3.1/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -W error work/benchmarks/stage-1.3.1/public_evidence.py
      - name: Verify Stage 1.4 independent lifecycle witness
        working-directory: .
        run: |
          python -B -W error -m unittest discover -s work/benchmarks/stage-1.4/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -W error work/benchmarks/stage-1.4/public_evidence.py
